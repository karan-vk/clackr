name: Bug report
description: Report a problem with clackr
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug! clackr is a terminal UI, so rendering bugs
        are almost always specific to *which* terminal, font, and size you
        used — please fill in the terminal fields below even if they feel
        redundant, they're usually the fastest way to reproduce the issue.

  - type: input
    id: version
    attributes:
      label: clackr version
      description: Output of `clackr --version`.
      placeholder: "clackr 0.1.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other (specify in additional context)
    validations:
      required: true

  - type: input
    id: arch
    attributes:
      label: Architecture
      placeholder: "x86_64 / aarch64 / arm64"
    validations:
      required: true

  - type: input
    id: terminal-emulator
    attributes:
      label: Terminal emulator
      description: >
        The terminal application you were running clackr in, including
        version if known. If you were inside tmux/screen, mention that too.
      placeholder: "Alacritty 0.14, Windows Terminal 1.21, iTerm2 3.5, tmux 3.4 inside GNOME Terminal, ..."
    validations:
      required: true

  - type: input
    id: term-env
    attributes:
      label: $TERM value
      description: Output of `echo $TERM` (Unix) or `echo $env:TERM` (PowerShell).
      placeholder: "xterm-256color"
    validations:
      required: true

  - type: input
    id: terminal-size
    attributes:
      label: Terminal size (columns x rows)
      description: >
        Output of `tput cols; tput lines`, your terminal's reported size, or
        the window size at the time the bug occurred if it's size-related.
      placeholder: "120x40"
    validations:
      required: true

  - type: dropdown
    id: simple-mode
    attributes:
      label: Does `--simple` change the behavior?
      description: >
        Please try reproducing with `clackr --simple` (and, if relevant,
        `--ascii` or `NO_COLOR=1 clackr`) and let us know whether the bug
        still happens. This narrows down whether it's specific to the
        full-fidelity renderer.
      options:
        - "Not tested"
        - "Bug still happens with --simple"
        - "Bug goes away with --simple"
        - "Not applicable (unrelated to rendering, e.g. config/CLI/engine behavior)"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen instead?
    validations:
      required: false

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: >
        Include the exact CLI flags and/or `config.toml` contents you used,
        if relevant.
      placeholder: |
        1. Run `clackr --mode words --words 25`
        2. Type ...
        3. See ...
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Screenshots, screen recordings, or your `config.toml`.
    validations:
      required: false
